<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>inspect</title>
<style>
  html, body { margin: 0; height: 100%; background: #6c7079; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// A development view of a baked model.glb: large, neutrally lit, from a chosen yaw,
// with the detail normal map switchable off (?flat=1) so a bake can be judged against
// the same model without it. Not linked from the studio.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const id = q.get('id');
const yaw = Number(q.get('yaw') || 35) * Math.PI / 180;
const pitch = Number(q.get('pitch') || 18) * Math.PI / 180;
const flat = q.get('flat') === '1';
const zoom = Number(q.get('zoom') || 1);

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6c7079);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(1.5, 2.5, 2); scene.add(key);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 100);

const gltf = await new GLTFLoader().loadAsync(`/p/${id}/model.glb`);
gltf.scene.traverse((o) => {
  if (!o.isMesh) return;
  const mats = Array.isArray(o.material) ? o.material : [o.material];
  for (const m of mats) { if (flat) { m.normalMap = null; m.needsUpdate = true; } }
  if (q.get('plain') === '1') {
    // the colour map on a fresh material: separates a texture problem from a material one
    o.material = mats.map((m) => new THREE.MeshStandardMaterial({ map: m.map, roughness: 0.9, side: THREE.DoubleSide }));
    if (!Array.isArray(o.material) || o.material.length === 1) o.material = o.material[0];
  }
  if (q.get('uvcheck') === '1') {
    // a UV test pattern in place of the map, so a mapping fault shows as a pattern fault
    const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { g.fillStyle = (x + y) % 2 ? '#d8d0c0' : '#3c4a6a'; g.fillRect(x * 128, y * 128, 128, 128); }
    const t = new THREE.CanvasTexture(c); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace;
    o.material = new THREE.MeshStandardMaterial({ map: t, roughness: 0.9, side: THREE.DoubleSide });
  }
});
scene.add(gltf.scene);
const box = new THREE.Box3().setFromObject(gltf.scene);
const size = new THREE.Vector3(); box.getSize(size);
const centre = new THREE.Vector3(); box.getCenter(centre);
const radius = size.length() / 2;
const dist = radius / Math.sin(camera.fov * Math.PI / 360) * 1.05 / zoom;
camera.position.set(
  centre.x + dist * Math.cos(pitch) * Math.sin(yaw),
  centre.y + dist * Math.sin(pitch),
  centre.z + dist * Math.cos(pitch) * Math.cos(yaw),
);
camera.lookAt(centre);
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
